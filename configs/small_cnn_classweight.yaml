# E4 ablation: small CNN + inverse-frequency class weights (everything else identical to small_cnn.yaml)
data_path: data/pneumoniamnist.npz
model: small_cnn
model_kwargs: {width: 32, dropout: 0.2}
epochs: 40
batch_size: 128
lr: 0.001
weight_decay: 0.0001
patience: 10
class_weighting: true
augment: true
